{% extends "base.html" %}
{% block title %}Gebruikers{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <p class="eyebrow">Beheer</p>
    <h1 class="page-title">Gebruikers</h1>
  </div>
</div>

<div class="card">
  <h3 class="card-title">Nieuwe gebruiker</h3>
  <form method="POST" action="{{ url_for('user_create') }}" class="form-stack">
    <div class="form-row">
      <label>
        <span>Naam</span>
        <input type="text" name="name" required>
      </label>
      <label>
        <span>E-mail</span>
        <input type="email" name="email" required>
      </label>
    </div>
    <div class="form-row">
      <label>
        <span>Wachtwoord</span>
        <input type="text" name="password" required minlength="6">
      </label>
      <label>
        <span>Rol</span>
        <select name="role" required>
          <option value="medewerker">Medewerker</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <label>
        <span>Manager (voor medewerker)</span>
        <select name="manager_id">
          <option value="">— Geen —</option>
          {% for m in managers %}
          <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Aanmaken</button>
  </form>
</div>

<section class="section">
  <h2 class="section-title">Alle gebruikers</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Naam</th>
          <th>E-mail</th>
          <th>Rol</th>
          <th>Manager</th>
          <th>Actief</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <form method="POST" action="{{ url_for('user_update', user_id=u.id) }}">
            <td><input type="text" name="name" value="{{ u.name }}" class="inline-input"></td>
            <td>{{ u.email }}</td>
            <td>
              <select name="role" class="inline-input">
                <option value="medewerker" {% if u.role == 'medewerker' %}selected{% endif %}>Medewerker</option>
                <option value="manager" {% if u.role == 'manager' %}selected{% endif %}>Manager</option>
                <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option>
              </select>
            </td>
            <td>
              <select name="manager_id" class="inline-input">
                <option value="">—</option>
                {% for m in managers %}
                <option value="{{ m.id }}" {% if u.manager_id == m.id %}selected{% endif %}>{{ m.name }}</option>
                {% endfor %}
              </select>
            </td>
            <td>
              <input type="checkbox" name="active" {% if u.active %}checked{% endif %}>
            </td>
            <td>
              <input type="text" name="password" placeholder="Nieuw wachtwoord (optioneel)" class="inline-input">
              <button type="submit" class="btn btn-sm btn-outline">Opslaan</button>
            </td>
          </form>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>

{% endblock %}
